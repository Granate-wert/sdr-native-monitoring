[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdr-native-monitoring"
version = "0.16.10"
description = "Windows-first tools for read-only R&S DFL analysis and a bounded C++20/Python SDR processing core"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [ { name = "Granate-Wert", email = "" } ]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "olefile>=0.47",
    "Pillow>=10.0",
    "imageio-ffmpeg>=0.5",
    "PySide6-Essentials>=6.8",
    "pyqtgraph>=0.13.7",
]

[project.optional-dependencies]
gui = [
    "vispy>=0.14.0",
    "zarr>=2.17",
    "numba>=0.60",
]
dev = [
    "pyinstaller>=6.0",
    "ruff>=0.1",
    "mypy>=1.7",
]

[project.scripts]
sdr-native-monitoring = "main:main"
sdr-native-validate = "benchmark_p15_validation:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "esw_dfl.gui",
    "esw_dfl.renderers",
    "esw_dfl.display",
    "esw_dfl.plotting",
    "esw_dfl.animation",
]
ignore_errors = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
